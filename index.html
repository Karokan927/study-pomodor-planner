<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/tasks.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/timer.css">
    <link rel="stylesheet" href="/css/stats.css">
    <link rel="stylesheet" href="/css/addtimer.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/themes.css">
</head>

<body id="MainBody" class="white-theme">
    <header>
        <nav class="nav-tabs">
            <button class='tab-btn active' data-tab="tasks">Tasks</button>
            <button class='tab-btn maintimer' data-tab="timer">Timer</button>
            <button class='tab-btn' data-tab="stats">Progress</button>
        </nav>
    </header>
    <main>
        <section>
            <div class="settings-container">
                <button id="settings-main-btn">
                    <img class="settings-icon" src="/svg/settings-svgrepo-com.svg">
                </button>
                <div class="settings-list" id="settings-list">
                    <button class="settings-btn" id="settings-theme-btn">
                        <img class="settings-icon" src="/svg/theme-store-svgrepo-com.svg">
                    </button>
                    <button class="settings-btn volume-btn" id="">
                        <img class="settings-icon" src="/svg/volume-max-svgrepo-com.svg">
                    </button>
                    <button class="settings-btn" id="">soon</button>
                </div>
            </div>
        </section>
        <section id="themes" class="themes-block">
            <div class="theme-container">
                <div class="theme-item active" data-theme="white-theme">Selected</div>
                <div class="theme-item " data-theme="dark-theme"></div>
            </div>
        </section>
        <section id="volume" class="volume">
            <div class="volume-container">
                <input id="volume-range" min="0" max="1" step="0.01" value="0.2" type="range">
            </div>
        </section>
        <section id="small-timer-container" class="additional-timer">
            <div id="small-timer" class="small-timer active">25:00</div>
        </section>
        <section id="tasks" class="tab-content active">
            <form id="todo-form">
                <input type="text" id="todo-input" placeholder='What do you want to do?' required>
                <button type="submit" class="todo-button">Create</button>
            </form>
            <ul id="todo-list">

            </ul>
        </section>
        <section id="timer" class="tab-content">
            <div id="timer-active-task">
                <p class="active-task-text">Task:<strong id="timer-active-task-title"></strong></p>
                <button id="clear-active-task-btn" class="todo-button ">Clear</button>
            </div>
            <div class="timer-text" id="timer-text"></div>
            <div id="timer-display" class="timer-main">
                25:00
            </div>
            <div class="timer-control">
                <button id="timer-start" class="timer-btn">Start</button>
                <button id="timer-stop" class="timer-btn">Pause</button>
                <button id="timer-reset" class="timer-btn">Reset</button>
            </div>
        </section>
        <section id="stats" class="tab-content">
            <div class="stats-container">
                <div class="stat-progress">
                    <h3>Study Progress</h3>
                    <div class="progress-bar-container">
                        <div id="progress-bar-fill"></div>
                    </div>
                    <p id="progress-text">0% tasks were completed</p>
                </div>
                <div class="stat-progress">
                    <h3>Session Focus</h3>
                    <div class="stat-progress-text">
                        <p class="stat-number" id="total-pomodoros">0</p>
                    </div>
                </div>
                <div>
                    <canvas id="myChart"></canvas>
                </div>

                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            </div>
        </section>
    </main>
    <script src="https://www.jsdelivr.com/package/npm/chart.js?path=dist"></script>
    <script type='module' src="/js/tab.js"></script>
    <script type="module" src="/js/todo.js"></script>
    <script type='module' src="/js/timer.js"></script>
    <script type='module' src="/js/settings.js"></script>
    <script type='module' src="/js/theme.js"></script>
    <script type='module' src="/js/volume.js"></script>
    <script type='module' src="/js/data.js"></script>
</body>

</html>
